[workspace]
resolver = "2"
members = [
    "crates/loco-engine",
    "crates/loco-cli",
    "crates/loco-memory",
    "crates/loco-embed",
    "crates/loco-agent",
]
exclude = [".tmp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
loco-engine = { path = "crates/loco-engine" }
loco-memory = { path = "crates/loco-memory" }
loco-embed = { path = "crates/loco-embed" }
loco-agent = { path = "crates/loco-agent" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hf-hub = { version = "0.4", default-features = true }
litertlm-rs = "0.16.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

[workspace]
resolver = "2"
members = ["crates/loco-engine", "crates/loco-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
loco-engine = { path = "crates/loco-engine" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hf-hub = { version = "0.4", default-features = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tempfile = "3"

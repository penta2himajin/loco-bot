[package]
name = "loco-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI entrypoint for loco-bot (download, doctor, chat)"

[[bin]]
name = "loco"
path = "src/main.rs"

[features]
default = ["inference", "embed"]
inference = ["loco-engine/inference"]
embed = ["loco-embed/ort"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
hf-hub = { workspace = true }
loco-engine = { workspace = true }
loco-memory = { workspace = true }
loco-embed = { workspace = true }
serde_json = { workspace = true }
